<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>세종시안전체험교육원 설문</title>
<style>
body { font-family: "Noto Sans KR", sans-serif; background:#fffdf7; text-align:center; padding:20px; }
h1 { color:#ff6f00; }
.question { font-size:2em; margin:40px 0; }
button { padding:10px 20px; margin:10px; font-size:1.2em; cursor:pointer; border-radius:10px; border:none; }
.green{background:#81c784;} .yellow{background:#fff176;} .red{background:#e57373;}
</style>
</head>
<body>

<h1>안전체험교육 설문조사</h1>
<p>오늘: <span id="date"></span></p>

<div>
<button onclick="selectGroup('유아')">유치원 / 어린이집</button>
<button onclick="selectGroup('초등')">초등학교 저학년</button>
</div>

<div id="question" style="display:none;">
<p class="question">교육을 통해 위험 상황 대처 방법을 잘 알게 되었나요?</p>
<button class="green" onclick="submitAnswer('O')">O</button>
<button class="yellow" onclick="submitAnswer('△')">△</button>
<button class="red" onclick="submitAnswer('X')">X</button>
<br>
<button onclick="cancelAnswer()">응답 취소</button>
</div>

<script>

const sheetURL = "https://script.google.com/macros/s/AKfycbzUDseeLHV-8cgOmxeGKamqdWelBx7duH7s3d2Ned8_4paLZ6L5bEF3qjRk5ZyYZg4/exec";

const today = new Date().toISOString().slice(0,10);
document.getElementById("date").textContent = today;

let selectedGroup = "";
let lastAnswer = null;

function selectGroup(group){
  selectedGroup = group;
  document.getElementById("question").style.display="block";
}

function submitAnswer(answer){

  if(!selectedGroup){
    alert("그룹을 선택하세요");
    return;
  }

  const timestamp = new Date().toISOString();

  fetch(sheetURL,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({
      date:today,
      time:timestamp,
      group:selectedGroup,
      answer:answer
    })
  })
  .then(res=>res.text())
  .then(data=>{
    console.log(data);
    lastAnswer = {answer:answer};
    alert("저장되었습니다");
  })
  .catch(err=>console.error(err));
}

function cancelAnswer(){

  if(!lastAnswer){
    alert("취소할 응답이 없습니다");
    return;
  }

  fetch(sheetURL,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({
      mode:"delete",
      date:today,
      group:selectedGroup,
      answer:lastAnswer.answer
    })
  })
  .then(res=>res.text())
  .then(data=>{
    console.log(data);
    alert("삭제되었습니다");
    lastAnswer=null;
  })
  .catch(err=>console.error(err));
}

</script>
</body>
</html>
