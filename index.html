<script>
window.onload = function() {

const sheetURL = "https://script.google.com/macros/s/AKfycbxZqltdENYcE6MimSCubSB-8j3SU1QsoYCSdgyPOxSrb8seerWr_6XG77IF24YgBCKj/exec";

const now = new Date();
const kst = new Date(now.getTime() + 9 * 60 * 60 * 1000);
const today = kst.toISOString().slice(0, 10);
const monthKey = today.slice(0, 7);
const weekDay = ["일", "월", "화", "수", "목", "금", "토"];
const dayOfWeek = kst.getUTCDay();

document.getElementById("date").textContent = today;
document.getElementById("weekday").textContent = weekDay[dayOfWeek];

let selectedGroup = "";
let lastAnswer = null;

window.selectGroup = function(group) {
  selectedGroup = group;
  document.getElementById("selectedGroup").textContent = group;
  document.getElementById("questionSection").style.display = "block";
  document.getElementById("groupButtons").style.display = "none";
  updateCountsFromSheet();
}

function showOverlay() {
  const overlay = document.getElementById("overlay");
  overlay.style.display = "flex";
  setTimeout(() => {
    overlay.style.display = "none";
  }, 1000);
}

window.submitAnswer = function(answer) {
  if (!selectedGroup) {
    alert("먼저 어떤 친구인지 선택해주세요!");
    return;
  }

  const timestamp = new Date().toISOString();
  showOverlay();

  fetch(sheetURL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      date: today,
      time: timestamp,
      group: selectedGroup,
      answer: answer
    })
  })
  .then(res => res.text())
  .then(() => {
    lastAnswer = { answer, timestamp };
    updateCountsFromSheet();
  })
  .catch(err => {
    console.error(err);
    alert("저장 중 오류 발생");
  });
}

window.cancelAnswer = function() {
  if (!lastAnswer) {
    alert("취소할 응답이 없습니다!");
    return;
  }

  fetch(sheetURL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      date: today,
      time: lastAnswer.timestamp,
      group: selectedGroup,
      answer: "취소"
    })
  })
  .then(res => res.text())
  .then(() => {
    lastAnswer = null;
    updateCountsFromSheet();
  })
  .catch(console.error);
}

function updateCountsFromSheet() {
  fetch(sheetURL)
    .then(res => res.json())
    .then(data => {
      const rows = data.slice(1);
      const daily = {"O": 0, "△": 0, "X": 0};
      const monthly = {"O": 0, "△": 0, "X": 0};

      rows.forEach(row => {
        const [date, group, answer] = row;
        if (group === selectedGroup) {
          if (date === today && daily[answer] !== undefined) daily[answer]++;
          if (date.startsWith(monthKey) && monthly[answer] !== undefined) monthly[answer]++;
        }
      });

      drawStatsTable(daily, monthly);
    })
    .catch(console.error);
}

window.requestPassword = function() {
  const pwd = prompt("관리자 비밀번호를 입력하세요:");
  if (pwd === "0705") {
    document.getElementById("statsTable").style.display = "block";
    updateCountsFromSheet();
  } else {
    alert("비밀번호가 틀렸습니다.");
  }
}

function drawStatsTable(daily, monthly) {
  const totalMonthly = Object.values(monthly).reduce((a,b)=>a+b, 0) || 1;

  document.getElementById("statsContent").innerHTML = `
    <h3>월별 누적 통계 (${monthKey})</h3>
    <table>
      <tr><th>응답</th><th>개수</th><th>백분율</th></tr>
      <tr><td>O</td><td>${monthly["O"]||0}</td><td>${((monthly["O"]||0)/totalMonthly*100).toFixed(1)}%</td></tr>
      <tr><td>△</td><td>${monthly["△"]||0}</td><td>${((monthly["△"]||0)/totalMonthly*100).toFixed(1)}%</td></tr>
      <tr><td>X</td><td>${monthly["X"]||0}</td><td>${((monthly["X"]||0)/totalMonthly*100).toFixed(1)}%</td></tr>
    </table>
  `;
}

};
</script>
